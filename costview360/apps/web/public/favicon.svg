<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Brutalist CV block: navy bg, mustard border, CV text -->
  <rect x="2" y="2" width="60" height="60" rx="0" fill="#0A1931" stroke="#0A1931" stroke-width="3"/>
  <!-- Mustard inner border accent -->
  <rect x="6" y="6" width="52" height="52" fill="#0A1931" stroke="#FFD23F" stroke-width="2"/>
  <text x="32" y="38" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">CV</text>
  <!-- Shadow hint -->
  <rect x="6" y="58" width="52" height="4" fill="#0A1931" opacity="0.9"/>
  <rect x="58" y="6" width="4" height="52" fill="#0A1931" opacity="0.9"/>
</svg>
